<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Acesse o sistema Arasaka.">
  <title>Arasaka | Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-card">
    <p class="brand">Arasaka</p>
    <p class="subtitle">Acesso ao sistema corporativo</p>
    <form id="formLogin" novalidate>
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
      </div>
      <button type="submit">Entrar no sistema</button>
    </form>
    <p id="mensagem" class="message" role="status" aria-live="polite"></p>
    <div class="form-links">
      <p>Ainda não possui uma conta? <a href="cadastro.html">Criar cadastro</a></p>
      <p><a href="admin-login.html">Acesso exclusivo da administração</a></p>
    </div>
  </main>
  <script src="js/login.js" defer></script>
</body>
</html>
