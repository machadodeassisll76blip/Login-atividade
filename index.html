<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arasaka - Início</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background:
                linear-gradient(135deg, rgba(8, 12, 24, 0.78), rgba(15, 23, 42, 0.55)),
                url("img/arasaka.svg") center / cover fixed no-repeat;
            background-color: #0f172a;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.82);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 1px;
        }

        .logout {
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        .logout:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        main {
            width: min(100% - 32px, 1000px);
            margin: 40px auto;
        }

        .welcome,
        .card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        }

        .welcome {
            padding: 30px;
            border-radius: 12px;
        }

        .welcome h2 {
            margin-bottom: 15px;
            color: #ffffff;
        }

        .welcome p,
        .card p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .welcome p {
            font-size: 17px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            padding: 25px;
            border-radius: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(96, 165, 250, 0.7);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #60a5fa;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            header h1 {
                font-size: 21px;
            }

            main {
                margin: 24px auto;
            }

            .welcome,
            .card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Arasaka</h1>
        <button class="logout" onclick="sair()">
            Sair
        </button>
    </header>
    <main>
        <section class="welcome">
            <h2 id="boasVindas">Bem-vindo ao Arasaka!</h2>
            <p>
                Você entrou no sistema com sucesso.
            </p>
        </section>
        <section class="cards">
            <div class="card">
                <h3>Dashboard</h3>
                <p>
                    Área principal do sistema.
                </p>
            </div>
            <div class="card">
                <h3>Usuários</h3>
                <p>
                    Gerencie os usuários do sistema.
                </p>
            </div>
            <div class="card">
                <h3>Configurações</h3>
                <p>
                    Configure as opções do sistema.
                </p>
            </div>
        </section>
    </main>
    <script>
        // 1. Pega o nome que o login guardou
        const nomeLogado = localStorage.getItem("usuarioLogado");

        // 2. Se tiver um nome, troca o texto do título
        if (nomeLogado) {
            document.getElementById("boasVindas").textContent =
                "Bem-vindo, " + nomeLogado + "!";
        }

        // 3. Botão Sair: apaga quem estava logado e volta para o login
        function sair() {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
