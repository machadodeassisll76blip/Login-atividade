<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arasaka - Início</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-image: url(img/back.jfif);
            min-height: 100vh;
            min-width: none;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        header {
            background: red;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 24px;
        }
        .logout {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout:hover {
            background: #e5e7eb;
        }
        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .welcome {
            background: transparent;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        .welcome h2 {
            color: #333;
            margin-bottom: 15px;
        }
        .welcome p {
            color: #666;
            font-size: 17px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .card {
            background: transparent;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
        }
        .card h3 {
            color: #2563eb;
            margin-bottom: 10px;
        }
        .card p {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Arasaka</h1>
        <button class="logout" onclick="sair()">
            Sair
        </button>
    </header>
    <main>
        <section class="welcome">
            <h2 id="boasVindas">Bem-vindo ao Arasaka!</h2>
            <p>
                Você entrou no sistema com sucesso.
            </p>
        </section>
        <section class="cards">
            <div class="card">
                <h3>Dashboard</h3>
                <p>
                    Área principal do sistema.
                </p>
            </div>
            <div class="card">
                <h3>Usuários</h3>
                <p>
                    Gerencie os usuários do sistema.
                </p>
            </div>
            <div class="card">
                <h3>Configurações</h3>
                <p>
                    Configure as opções do sistema.
                </p>
            </div>
        </section>
    </main>
    <script>
        // 1. Pega o nome que o login guardou
        const nomeLogado = localStorage.getItem("usuarioLogado");

        // 2. Se tiver um nome, troca o texto do título
        if (nomeLogado) {
            document.getElementById("boasVindas").textContent =
                "Bem-vindo, " + nomeLogado + "!";
        }

        // 3. Botão Sair: apaga quem estava logado e volta para o login
        function sair() {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
