<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Painel de demonstração do sistema Arasaka.">
  <title>Arasaka | Painel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="brand">Arasaka</h1>
    <button id="botaoSair" type="button">Sair</button>
  </header>
  <main class="dashboard">
    <section class="panel welcome">
      <h2 id="boasVindas">Bem-vindo!</h2>
      <p>Você acessou o painel de demonstração. Esta área representa a página inicial após o login.</p>
    </section>
    <section class="dashboard-grid" aria-label="Áreas do sistema">
      <article class="panel dashboard-card">
        <h3>Dashboard</h3>
        <p>Resumo e visão geral do sistema.</p>
      </article>
      <article class="panel dashboard-card">
        <h3>Usuários</h3>
        <p>Espaço demonstrativo para gerenciamento de usuários.</p>
      </article>
      <article class="panel dashboard-card">
        <h3>Configurações</h3>
        <p>Espaço demonstrativo para preferências do sistema.</p>
      </article>
    </section>
  </main>
  <script src="js/painel.js" defer></script>
</body>
</html>
