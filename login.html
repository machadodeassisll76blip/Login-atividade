<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tech System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main>
        <h1>Tech System</h1>
        <h2>Área de Login</h2>

        <form id="formLogin">

            <label for="usuario">Usuário:</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label for="senha">Senha:</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">Entrar</button>

        </form>

        <p id="mensagem"></p>

        <div class="links">
            <p>
                <a href="#">Esqueci minha senha</a>
            </p>

            <p style="margin-top: 10px;">
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </main>

    <script>
        const formLogin = document.getElementById("formLogin");

        formLogin.addEventListener("submit", function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            // Busca a lista de usuários salvos pelo cadastro.
            // Se não tiver ninguém cadastrado, usamos uma lista vazia [].
            const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            // Aqui vamos guardar a pessoa encontrada (começa vazio)
            let usuarioEncontrado = null;

            // Login de teste: o admin continua funcionando
            if (usuario === "admin" && senha === "1234") {
                usuarioEncontrado = { nome: "Administrador" };
            }

            // Procura na lista alguém com o mesmo usuário E a mesma senha
            for (let i = 0; i < usuarios.length; i++) {
                if (usuarios[i].usuario === usuario && usuarios[i].senha === senha) {
                    usuarioEncontrado = usuarios[i];
                }
            }

            if (usuarioEncontrado !== null) {

                // Guarda o nome de quem entrou, para a página inicial mostrar
                localStorage.setItem("usuarioLogado", usuarioEncontrado.nome);

                mensagem.textContent = "Login realizado! Entrando...";
                mensagem.style.color = "green";

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 500);

            } else {

                mensagem.textContent = "Usuário ou senha incorretos.";
                mensagem.style.color = "red";
            }
        });

            } else {

        });
    </script>

</body>
</html>
