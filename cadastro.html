<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Crie uma conta de demonstração no sistema Arasaka.">
  <title>Arasaka | Criar conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-card">
    <p class="brand">Arasaka</p>
    <p class="subtitle">Crie seu acesso ao sistema</p>
    <form id="formCadastro" novalidate>
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="nome@exemplo.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Escolha um usuário" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" autocomplete="new-password" required>
      </div>
      <button type="submit">Criar conta</button>
    </form>
    <p id="mensagem" class="message" role="status" aria-live="polite"></p>
    <div class="form-links"><p>Já possui uma conta? <a href="index.html">Voltar ao login</a></p></div>
  </main>
    <label class="theme-picker-wrap" title="Personalizar cor do tema">
    <span aria-hidden="true">◉</span>
    <input id="themeColor" type="color" value="#ed101b" aria-label="Escolher cor do tema">
  </label>
  <script src="js/theme.js" defer></script>
<script src="js/cadastro.js" defer></script>
</body>
</html>
