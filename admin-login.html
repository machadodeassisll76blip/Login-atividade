<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#070707"><title>Arasaka | Acesso administrativo</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-card"><p class="brand">Arasaka</p><p class="subtitle">Acesso exclusivo da administração</p><p class="admin-help">Use a conta cadastrada com permissão de administrador. Não existe senha padrão.</p>
<form id="formAdminLogin" novalidate><div class="form-group"><label for="usuarioAdmin">Usuário administrativo</label><input id="usuarioAdmin" name="usuario" autocomplete="username" required></div><div class="form-group"><label for="senhaAdmin">Senha</label><input id="senhaAdmin" name="senha" type="password" autocomplete="current-password" required></div><button type="submit">Autenticar administração</button></form>
<p id="mensagemAdminLogin" class="message" role="status" aria-live="polite"></p><div class="form-links"><p>Primeiro acesso neste navegador? <a href="cadastro.html">Criar a primeira conta</a></p><p><a href="index.html">Voltar ao login comum</a></p></div></main><script src="js/admin-login.js" defer></script></body></html>
